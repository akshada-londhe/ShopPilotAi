repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies: [pydantic==2.10.5]
        args: [--strict]

  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest (unit only, deterministic)
        entry: pytest -m "not integration and not benchmark"
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: pytest-integration
        name: pytest (integration, real APIs)
        entry: pytest -m integration
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
